[package]
name = "pinakes"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Self-hosted knowledge service for AI agents: an LLM-maintained wiki and a business graph, searched in milliseconds, far faster than RAG, with no LLM or database on the read path. HTTP and MCP."
license = "MIT OR Apache-2.0"
repository = "https://github.com/chenkezhen480/pinakes-rs"
readme = "README.md"
keywords = ["knowledge-base", "mcp", "agent", "rag", "wiki"]
categories = ["web-programming::http-server", "text-processing", "database"]
default-run = "pinakes"
# What the published crate holds: what the build reads (the prompts and rules are built in, and
# the console's built files in `ui/dist/` are embedded; its sources and Node setup stay out), the
# shipped config and model template, and the docs a user reads.
include = [
    "/src/**",
    "/prompts/**",
    "/rules/**",
    "/ui/dist/**",
    "/build.rs",
    "/config.toml",
    "/model.conf.example",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/docs/guide.md",
    "/docs/configuration.md",
    "/docs/performance.md",
]
# The tests in tests/ are one program (tests/main.rs), not one per file: see [[test]] below.
autotests = false

[dependencies]
aho-corasick = "1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22.1"
calamine = { version = "0.36", features = ["dates"] }
csv = "1.4"
ego-tree = "0.11"
encoding_rs = "0.8"
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures-util = "0.3.34"
hex = "0.4.3"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
jieba-rs = "0.11"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
neo4rs = "=0.9.0-rc.10"
petgraph = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.41"
rayon = "1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1"
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
similar = "3.2.0"
tantivy = "0.26"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
# Office files are zip archives; the same version and features calamine uses.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
argon2 = "0.6"
percent-encoding = "2.3.2"
# PDF text, read by the `pinakes-pdf` helper in a process of its own (design, "PDF read by the
# service"). Pure Rust; Chinese CMaps only (Japanese and Korean left out).
pdfni = { version = "0.2.0", default-features = false, features = ["document", "cmap-gb1", "cmap-cns1"] }
# A scan's pages drawn as images for the model to read, by the same helper (design, "Scans read
# by the model"). Pure Rust.
hayro = "0.8.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
# The console's API types (ui/src/api/types.ts) are generated from the Rust structs in a test.
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

# Every file of tests/ is a module of this one test program: linking the service (and ONNX
# Runtime) once instead of 26 times keeps builds fast and target/ small.
[[test]]
name = "integration"
path = "tests/main.rs"

# Debug builds (and tests) keep line tables only: backtraces still name files and lines. With
# full debug info every test binary, each linking ONNX Runtime, had a .pdb of about 300 MB, and
# target/ grew past 100 GB as dependency changes left old binaries behind.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is far too slow unoptimized (signing in, tests).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
