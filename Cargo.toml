[package]
name = "pinakes"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A self-hosted knowledge service for AI agents: an LLM-maintained wiki with a business graph, searched in milliseconds over HTTP and MCP, in Chinese and English"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chenkezhen480/pinakes-rs"
readme = "README.md"
keywords = ["knowledge-base", "mcp", "agent", "rag", "wiki"]
categories = ["web-programming::http-server", "text-processing", "database"]
default-run = "pinakes"
# The tests in tests/ are one program (tests/main.rs), not one per file: see [[test]] below.
autotests = false

[dependencies]
aho-corasick = "1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
hex = "0.4.3"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
jieba-rs = "0.11"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
neo4rs = "=0.9.0-rc.10"
petgraph = "0.8"
rayon = "1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
similar = "3.2.0"
tantivy = "0.26"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Every file of tests/ is a module of this one test program: linking the service (and ONNX
# Runtime) once instead of 26 times keeps builds fast and target/ small.
[[test]]
name = "integration"
path = "tests/main.rs"

# Debug builds (and tests) keep line tables only: backtraces still name files and lines. With
# full debug info every test binary, each linking ONNX Runtime, had a .pdb of about 300 MB, and
# target/ grew past 100 GB as dependency changes left old binaries behind.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
