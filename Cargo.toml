[package]
name = "pinakes"
version = "0.1.0"
edition = "2024"
default-run = "pinakes"

[dependencies]
aho-corasick = "1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart"] }
hex = "0.4.3"
jieba-rs = "0.11"
neo4rs = "=0.9.0-rc.10"
petgraph = "0.8"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
similar = "3.2.0"
tantivy = "0.26"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
