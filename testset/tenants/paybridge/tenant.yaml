id: paybridge
business: Payments and risk
description: >
  A payment service provider for online merchants. Agents help risk analysts and merchant
  success managers with chargebacks, fraud rules, settlements, merchant onboarding (KYC) and
  compliance questions.
users:
  - { id: marco, role: risk analyst, lang: en, groups: [risk-team] }
  - { id: chen, role: merchant success manager, lang: zh }
graph:
  schemas: [payments]
  spaces:
    - { id: acquiring, schema: payments, name: 收单业务, aliases: [acquiring, card acquiring] }
    - id: investigations
      schema: payments
      name: 风险调查
      aliases: [fraud investigations, investigations, 调查]
      visibility: restricted
      members: { users: [marco], groups: [risk-team] }
