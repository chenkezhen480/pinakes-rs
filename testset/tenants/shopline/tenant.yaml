id: shopline
business: E-commerce marketplace
description: >
  A Chinese B2C marketplace with third-party sellers. Agents handle buyer support (refunds,
  logistics, coupons, counterfeit claims) and help operations staff with promotions and seller
  management.
users:
  - { id: lily, role: operations manager, lang: zh }
  - { id: wang, role: customer service lead, lang: en }
graph:
  schemas: [commerce]
  spaces:
    - { id: mainland, schema: commerce, name: 国内站, aliases: [mainland store, domestic site, 国内] }
    - { id: crossborder, schema: commerce, name: 跨境站, aliases: [cross-border store, 跨境, global store] }
