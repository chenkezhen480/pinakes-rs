# The configuration the Docker image runs with (`docker compose up`); config.toml in the
# repository root is for running the service on the host. Secrets stay in the environment
# (PINAKES_ADMIN_PASSWORD for the console, 1234 when unset;
# PINAKES_ADMIN_KEY; NEO4J_PASSWORD with the Neo4j backend); the librarian's model and key are in model.conf, which
# docker-compose.yml mounts next to this file. On first start this file is copied into the data
# volume (/data/config.toml), which the service then uses and the console writes back to; an
# updated image doesn't replace it (the log says when the two differ). Relative paths in it
# are read from /data.

[server]
host = "0.0.0.0"               # inside the container; compose decides what the host exposes
port = 8080
threads = 0                     # threads the service computes on; 0 = 4 (or fewer CPUs)

[data]
dir = "/data"                  # the pinakes-data volume

[identity]
mode = "api_key"               # or "jwt"
deployment = "multi_tenant"    # or "personal": one person, default tenant and user below
default_tenant = "000000"      # personal: created on first start, key in <data>/personal-api-key.txt
default_user = "admin"         # personal: the user when no user header is sent (no admin rights)
key_header = "Authorization"   # "Bearer <key>"
user_header = "X-User-Id"
group_header = "X-User-Groups"
audience_header = "X-Audience" # who an insert is for: tenant, user or group:<id>
admin_key_env = "PINAKES_ADMIN_KEY"
# jwt mode: `Authorization: Bearer <token>` signed by the host; tenant, user and groups come
# from its claims (the tenant must exist: POST /admin/tenants), the audience header stays.
# public_key_file = "keys/auth.pem"   # the host's public key (PEM), relative to this file
# algorithm = "RS256"                 # RS256/384/512, PS256/384/512, ES256/384 or EdDSA
# tenant_claim = "tenant_id"
# user_claim = "sub"
# groups_claim = "groups"             # a list of group ids
# issuer = "https://auth.example"     # when set, tokens must carry this `iss`
# audience = "pinakes"                # when set, tokens must carry this `aud`; unset: none allowed

[store]                        # one SQLite file per tenant, WAL mode
file_name = "pinakes.sqlite"

[librarian]                    # the only LLM the service calls, never on the read path
model_file = "/app/model.conf"   # mounted (read-only) from the repository root by docker-compose.yml
max_tokens = 16000             # per reply
timeout_secs = 300             # per call
related_pages = 8              # related pages the librarian is shown (5 to 10 in the design)
read_window_tokens = 20000     # how much of a document one read sees; grows for a long concept
auto_approve = false           # true: every proposal is approved at once instead of waiting on the
                               # Review page: held edits (filing, lint, hand edits), sources found
                               # outside and agents' graph drafts

[converter]                    # MarkItDown, optional: PDF and the old binary Office formats. The service
                               # reads Markdown, text, HTML, Word, spreadsheets and PowerPoint itself.
# url = "http://converter:8090"  # with `docker compose --profile markitdown up -d --build`
timeout_secs = 120

[search]
slots = { memories = 3, knowledge = 3, relations = 5 }   # hits per slot by default, max 20
session_idle_minutes = 30      # read-tracker sessions expire after this idle time
languages = ["en", "zh"]
default_mode = "auto"          # keyword, semantic or auto, when a search doesn't say
hop = { top_memories = 3 }     # the top memories whose knowledge anchors join the knowledge slot
vector_graph_rows = 100000     # (M9) from this many page vectors on, meaning search walks a graph index; 0 never

[trace]                        # search traces: <tenant>/logs/search-<date>.jsonl
enabled = true
retention_days = 30            # 0 keeps them forever

[embedding]                    # (M5) local, runs inside the process; files go to /data/models
enabled = false                # off: keyword search only, nothing downloaded. On (console or here):
                               # the model (about 640 MB) is downloaded once, kept as an 8-bit copy (316 MB)
                               # and pages embedded, no restart
model = "jina-embeddings-v2-base-zh"   # Chinese and English; unset: embeddings can't be turned on

[graph]
backend = "sqlite"             # graph.sqlite in each tenant folder; or "neo4j" (see [neo4j])
max_depth = 3                  # deepest /graph walk a caller may ask for
max_nodes = 100                # most nodes a /graph walk returns

[neo4j]                        # only with backend = "neo4j" and the compose profile `neo4j`
uri = "bolt://neo4j:7687"
user = "neo4j"
password_env = "NEO4J_PASSWORD"   # the variable holding the password

[acquisition]                  # (M9) off by default; the admin turns it on per tenant, with the
                               # sites it trusts: PUT /admin/tenants/{id}/acquisition. Only those
                               # sites are read; no search engine is asked anything.
enabled = false
daily_token_budget = 200000    # per tenant and day, acquisition's own model calls
crawl_pages_per_site = 500     # most pages read per trusted site
crawl_every_days = 7           # read the sites again after this many days (at once when the list changes)
crawl_delay_ms = 1000          # pause between two requests to the sites

[cache]                        # tenants in memory
idle_minutes = 30              # a tenant unused this long frees its search snapshot and graph; 0 never

[jobs]                         # the per-tenant write queue; job status kept in the tenant's SQLite
keep_finished_minutes = 60     # finished jobs stay visible at /jobs/{id} this long
