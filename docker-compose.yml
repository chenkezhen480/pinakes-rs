# The whole service: `docker compose up -d --build` starts Pinakes, which reads Markdown, text,
# HTML, Word, spreadsheets and PowerPoint itself; graph data is kept in SQLite in each tenant's
# folder. Two parts are optional. The MarkItDown converter, for PDF and the old binary Office
# formats: set `[converter] url = "http://converter:8090"` in docker/config.toml and start with
# `docker compose --profile markitdown up -d --build`. Neo4j: set `backend = "neo4j"` there
# and start with `NEO4J_PASSWORD=... docker compose --profile neo4j up -d --build`.
# Before the first start, copy model.conf.example to model.conf (the
# librarian's model and key; mounted, never built into the image). The console signs in as
# root / 1234 (or PINAKES_ADMIN_PASSWORD from .env); change it before exposing the port. Scripts
# calling the admin routes use PINAKES_ADMIN_KEY. All of Pinakes' own data sits in the pinakes-data volume.
#
# For development on the host (`cargo run`, `cargo test`), start only what is needed: MarkItDown
# on 127.0.0.1:8090 with `docker compose --profile dev up -d --build converter-dev`, and for the
# Neo4j backend's tests `NEO4J_PASSWORD=... docker compose --profile neo4j up -d neo4j`.
# Published ports are bound to 127.0.0.1 only; set PINAKES_PORT (such as 8080) to expose the
# service on every interface. Search traces name the code that answered: build with
# `PINAKES_GIT_COMMIT=$(git rev-parse --short=12 HEAD)`, or they say `unknown`.
# Everything is named `pinakes`, whatever the folder is called: the project (so volumes are
# `pinakes_pinakes-data` and `pinakes_neo4j-data`), the containers and the images.
name: pinakes

services:
  pinakes:
    container_name: pinakes
    image: pinakes:latest
    build:
      context: .
      args:
        PINAKES_GIT_COMMIT: ${PINAKES_GIT_COMMIT:-unknown}
    ports:
      - "${PINAKES_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - pinakes-data:/data
      - type: bind
        source: ./model.conf
        target: /app/model.conf
        read_only: true
        bind:
          create_host_path: false
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      PINAKES_ADMIN_KEY: ${PINAKES_ADMIN_KEY:-}
      PINAKES_ADMIN_USER: ${PINAKES_ADMIN_USER:-}
      PINAKES_ADMIN_PASSWORD: ${PINAKES_ADMIN_PASSWORD:-}
      # A Hugging Face mirror for the embedding model's first download, if needed.
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      # With the markitdown profile, started once the converter answers (its image's
      # healthcheck): an upload right after `up` would otherwise find it still loading.
      # Without the profile there is no converter, and Pinakes starts alone.
      converter:
        condition: service_healthy
        required: false
    networks: [default, internal]
    restart: unless-stopped

  neo4j:
    # Optional: only with `backend = "neo4j"` (start Pinakes after it is healthy).
    profiles: [neo4j]
    container_name: pinakes-neo4j
    # Pinned: the version the neo4rs driver (0.9.0-rc.10) is tested against here.
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}   # set NEO4J_PASSWORD; Neo4j refuses an empty one
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes: ["neo4j-data:/data"]
    # The service connects once at startup, so it starts only when Neo4j answers queries.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  converter:
    # Optional (profile markitdown): PDF and the old binary Office formats. Uploads are untrusted: no root, nothing writable but a small /tmp, no capabilities,
    # bounded memory and processes, and no way out: the internal network reaches only Pinakes.
    profiles: [markitdown]
    container_name: pinakes-converter
    image: pinakes-converter:latest
    build: ./converter
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 64
    restart: unless-stopped

  # The same converter on 127.0.0.1:8090, for the service running on the host and for
  # `PINAKES_TEST_CONVERTER` (a published port needs a network with a way out).
  converter-dev:
    profiles: [dev]
    container_name: pinakes-converter-dev
    image: pinakes-converter:latest
    build: ./converter
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 64
    restart: unless-stopped

networks:
  internal:
    internal: true

volumes:
  pinakes-data:
  neo4j-data:
