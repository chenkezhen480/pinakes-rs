name: Feature request / 功能建议
description: Suggest a change or a new capability. 建议新功能或改进。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / 要解决的问题
      description: What you are trying to do and what gets in the way. 你想做什么、遇到了什么阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose / 建议的方案
      description: How it could work. If it changes behavior, which part of docs/design.md it touches. 可以怎么做；若改变行为，涉及 docs/design.md 的哪一部分。
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
