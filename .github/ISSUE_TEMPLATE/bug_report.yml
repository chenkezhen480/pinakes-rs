name: Bug report / 问题报告
description: Something doesn't work as documented. 功能与文档描述不符。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to a private report instead (see SECURITY.md). Never paste API keys, `model.conf` or tenant data.
        安全问题请私下报告（见 SECURITY.md）。请勿粘贴 API Key、`model.conf` 或租户数据。
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: What you did, what you expected, and what happened instead. 你做了什么、预期是什么、实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce / 复现步骤
      description: The requests (with keys removed) or steps, and the response or log lines. 请求（去掉密钥）或操作步骤，以及返回或日志。
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: v0.1.0 or c02cf7e
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How it runs / 运行方式
      options:
        - Docker Compose
        - cargo run (from source)
        - other / 其他
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup / 环境
      description: OS, graph backend (SQLite or Neo4j), identity mode (API key or JWT), deployment (personal or multi-tenant), the model provider. 操作系统、图存储、身份模式、部署方式、模型提供方。
