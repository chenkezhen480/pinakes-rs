name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is line tables only (Cargo.toml's dev profile); no incremental files in CI.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The image's preinstalled SDKs this build doesn't use (about 20 GB).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        # Two jobs at a time keep the test build within the runner's memory.
        run: cargo test --locked -j 2 --no-fail-fast
      - name: Disk left
        if: always()
        run: df -h / && du -sh target || true

  console:
    name: console (check, build, browser tests)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check
        working-directory: ui
        run: npm run check
      - name: Build, and the committed build is current
        working-directory: ui
        run: npm run build && git diff --exit-code -- dist
      - name: Browser tests
        working-directory: ui
        run: npx playwright install --with-deps chromium && npx playwright test

  deny:
    name: licenses, advisories and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
